name: AEW resource economy study
on:
  workflow_dispatch:
  push:
    branches:
      - diagnostics/aew-0.5.0
    paths:
      - aew/resource_study.py
      - tests/test_resource_models.py
      - .github/workflows/aew-resource-study.yml
jobs:
  resource-study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correctness and determinism tests
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Compare resource models at 100 steps
        run: python -m aew.resource_study --sizes 1000 5000 10000 --ticks 100 --out resource-results
      - name: Verify report
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path("resource-results")
          rows=list(csv.DictReader((p/"summary.csv").open()))
          assert len(rows)==9
          assert {r["model"] for r in rows}=={"baseline","scaled","abundant"}
          assert all(int(r["final_population"])>=0 for r in rows)
          print("Nine model-size combinations recorded")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aew-resource-study
          path: resource-results/
