name: AEW diagnostic verification
on:
  workflow_dispatch:
  push:
    branches:
      - diagnostics/aew-0.5.0
jobs:
  correctness-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Correctness tests
        run: python -m pytest -q
      - name: Small load test and diagnostic report
        run: python -m aew.experiments --agents 100 --ticks 100 --seeds 1 --groups ABCDE --out smoke-results
      - name: Check smoke outputs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path("smoke-results")
          rows=list(csv.DictReader((p/"results.csv").open()))
          assert len(rows)==5
          assert all("eligible_both" in r and "deaths" in r for r in rows)
          assert all((p/f"{g}_000.json").exists() for g in "ABCDE")
          print(json.dumps(json.loads((p/"summary.json").read_text()),indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aew-diagnostic-smoke
          path: smoke-results/
