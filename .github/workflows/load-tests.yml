name: AEW 0.5.0 load tests

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Load profile'
        required: true
        default: '10k-100'
        type: choice
        options:
          - 10k-100
          - 10k-1000
          - 10k-10000
          - 50k-100

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run correctness suite first
        run: python -m pytest -q
      - name: Execute selected load profile
        shell: bash
        run: |
          mkdir -p load-results
          case "${{ inputs.profile }}" in
            10k-100) AGENTS=10000; TICKS=100 ;;
            10k-1000) AGENTS=10000; TICKS=1000 ;;
            10k-10000) AGENTS=10000; TICKS=10000 ;;
            50k-100) AGENTS=50000; TICKS=100 ;;
            *) echo "Unknown profile"; exit 2 ;;
          esac
          /usr/bin/time -v -o load-results/resources.txt \
            python -m aew.experiments --agents "$AGENTS" --ticks "$TICKS" --seeds 1 --groups A --out load-results/run
      - name: Upload load measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aew-load-${{ inputs.profile }}-${{ github.run_id }}
          path: load-results/
          retention-days: 30
