name: AEW staged load verification
on:
  workflow_dispatch:
  push:
    branches:
      - diagnostics/aew-0.5.0
    paths:
      - aew/load_benchmark.py
      - .github/workflows/aew-staged-load.yml
jobs:
  staged-load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correctness gate
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Sequential load 1000 5000 10000
        run: python -m aew.load_benchmark --sizes 1000 5000 10000 --ticks 100 --out load-results
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aew-staged-load-results
          path: load-results/
