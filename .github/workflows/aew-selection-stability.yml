name: AEW controlled selection and stability
on:
  workflow_dispatch:
  push:
    branches:
      - diagnostics/aew-0.5.0
    paths:
      - aew/selection_study.py
      - tests/test_selection_controls.py
      - .github/workflows/aew-selection-stability.yml
jobs:
  selection-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correctness tests
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Nine controlled 10000-step simulations
        run: python -m aew.selection_study --agents 10000 --ticks 10000 --seeds 42 43 44 --modes normal no_mutation no_inheritance --out selection-results
      - name: Validate results
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path("selection-results")
          rows=list(csv.DictReader((p/"summary.csv").open()))
          assert len(rows)==9
          assert {r["mode"] for r in rows}=={"normal","no_mutation","no_inheritance"}
          assert all(int(r["ticks"])==10000 for r in rows)
          print("Nine long-run controlled results recorded")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aew-selection-stability
          path: selection-results/
